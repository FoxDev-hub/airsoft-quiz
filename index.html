<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a2214" />
  <meta name="description" content="KDS KVIZ — airsoft quiz za moderatore, 3 nasumična pitanja iz pravilnika." />
  <title>KDS KVIZ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="noise" aria-hidden="true"></div>

  <main class="app">
    <header class="hero">
      <p class="hero__eyebrow">Airsoft · Pravilnik</p>
      <h1 class="hero__brand">KDS KVIZ</h1>
      <p class="hero__lead">Izvuci 3 pitanja i pitaj jednog igrača. Odgovor otvori kad budeš spreman.</p>
      <button type="button" class="btn-randomize" id="randomizeBtn" disabled>
        <span class="btn-randomize__label">Randomize</span>
        <span class="btn-randomize__hint">3 pitanja</span>
      </button>
      <p class="status" id="status" role="status" aria-live="polite">Učitavanje pitanja…</p>
    </header>

    <section class="cards" id="cards" aria-label="Izvučena pitanja" hidden></section>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
